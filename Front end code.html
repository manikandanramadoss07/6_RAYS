<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jeeva Setu</title>

<style>

:root{
    --primary:#0878c9;
    --primary-dark:#04558f;
    --bg:#f4f8fc;
    --card:#ffffff;
    --text:#17212b;
    --muted:#64748b;
    --border:#d8e3ee;
    --green:#16a34a;
    --yellow:#eab308;
    --red:#dc2626;
    --shadow:0 8px 25px rgba(0,0,0,.08);
}

body.dark{
    --bg:#08111c;
    --card:#101d2b;
    --text:#ffffff;
    --muted:#c1ccd8;
    --border:#ffffff;
    --shadow:0 8px 25px rgba(0,0,0,.4);
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
}

button,input,select,textarea{
    font:inherit;
}

button{
    cursor:pointer;
}

.hidden{
    display:none!important;
}

.app{
    width:100%;
    max-width:480px;
    min-height:100vh;
    margin:auto;
    background:var(--bg);
}

/* LOGIN */

#loginPage{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.login-card{
    width:100%;
    background:var(--card);
    padding:30px 22px;
    border-radius:24px;
    box-shadow:var(--shadow);
    border:1px solid var(--border);
}

.logo{
    width:72px;
    height:72px;
    margin:auto;
    border-radius:20px;
    background:var(--primary);
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:28px;
    font-weight:bold;
}

.login-card h1{
    text-align:center;
    margin-top:15px;
}

.login-card p{
    text-align:center;
    color:var(--muted);
    margin:8px 0 25px;
}

.login-input{
    width:100%;
    padding:14px;
    margin:7px 0;
    border-radius:12px;
    border:1px solid var(--border);
    background:var(--bg);
    color:var(--text);
    outline:none;
}

.login-input:focus{
    border-color:var(--primary);
}

.portal-buttons{
    display:grid;
    gap:12px;
    margin-top:15px;
}

.portal-btn{
    padding:15px;
    border-radius:13px;
    border:1px solid var(--primary);
    background:transparent;
    color:var(--primary);
    font-weight:bold;
}

.portal-btn:hover{
    background:var(--primary);
    color:white;
}

.login-btn{
    width:100%;
    padding:14px;
    margin-top:12px;
    border:0;
    border-radius:12px;
    background:var(--primary);
    color:white;
    font-weight:bold;
}

.secondary-btn{
    width:100%;
    padding:13px;
    margin-top:9px;
    border:1px solid var(--border);
    border-radius:12px;
    background:transparent;
    color:var(--text);
    font-weight:bold;
}

/* HEADER */

.header{
    padding:18px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.header h2{
    font-size:22px;
}

.header small{
    color:var(--muted);
}

.theme-btn{
    width:42px;
    height:42px;
    border-radius:50%;
    border:1px solid var(--border);
    background:var(--card);
    color:var(--text);
}

/* CONTENT */

.content{
    padding:0 16px 100px;
}

.card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:18px;
    padding:16px;
    margin-bottom:14px;
    box-shadow:var(--shadow);
}

.card h3{
    margin-bottom:12px;
}

.stat-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.stat-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:18px;
}

.stat-card span{
    color:var(--muted);
    font-size:13px;
}

.stat-card strong{
    display:block;
    margin-top:6px;
    font-size:27px;
}

/* DASHBOARD */

.dashboard-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.dashboard-btn{
    min-height:110px;
    border:1px solid var(--border);
    background:var(--card);
    color:var(--text);
    border-radius:18px;
    padding:15px;
    text-align:left;
}

.dashboard-btn:hover{
    border-color:var(--primary);
}

.dashboard-btn .icon{
    font-size:27px;
    margin-bottom:10px;
}

.dashboard-btn b{
    display:block;
    margin-bottom:5px;
}

.dashboard-btn small{
    color:var(--muted);
}

/* PATIENT */

.patient-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:18px;
    padding:16px;
    margin-bottom:12px;
}

.patient-card:active{
    transform:scale(.99);
}

.patient-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.patient-name{
    font-size:17px;
    font-weight:bold;
}

.patient-info{
    color:var(--muted);
    line-height:1.65;
    margin-top:7px;
}

.risk-badge{
    padding:6px 10px;
    border-radius:20px;
    font-size:12px;
    font-weight:bold;
}

.green{
    background:#dcfce7;
    color:#166534;
}

.yellow{
    background:#fef9c3;
    color:#854d0e;
}

.red{
    background:#fee2e2;
    color:#991b1b;
}

/* FILTER */

.filters{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding-bottom:8px;
}

.filter{
    white-space:nowrap;
    padding:9px 14px;
    border-radius:20px;
    border:1px solid var(--border);
    background:var(--card);
    color:var(--text);
}

.filter.active{
    background:var(--primary);
    color:white;
}

/* FORM */

.form-group{
    margin-bottom:13px;
}

.form-group label{
    display:block;
    font-size:13px;
    font-weight:bold;
    margin-bottom:6px;
}

.form-control{
    width:100%;
    padding:12px;
    border-radius:11px;
    border:1px solid var(--border);
    background:var(--bg);
    color:var(--text);
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.primary-btn{
    width:100%;
    padding:13px;
    border:0;
    border-radius:12px;
    background:var(--primary);
    color:white;
    font-weight:bold;
}

/* PARAMETERS */

.parameter-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px 0;
    border-bottom:1px solid var(--border);
}

.parameter-row:last-child{
    border-bottom:0;
}

/* NOTES */

.note{
    background:var(--bg);
    border:1px solid var(--border);
    padding:12px;
    border-radius:12px;
    margin-bottom:8px;
}

.note small{
    color:var(--muted);
}

/* CHART */

.chart{
    width:100%;
    height:190px;
    background:var(--bg);
    border:1px solid var(--border);
    border-radius:14px;
    padding:10px;
}

.chart svg{
    width:100%;
    height:100%;
}

/* BOTTOM NAV */

.bottom-nav{
    position:fixed;
    bottom:0;
    left:50%;
    transform:translateX(-50%);
    width:100%;
    max-width:480px;
    background:var(--card);
    border-top:1px solid var(--border);
    display:flex;
    justify-content:space-around;
    padding:9px 4px;
    z-index:50;
}

.nav-btn{
    background:none;
    border:0;
    color:var(--muted);
    font-size:11px;
}

.nav-btn span{
    display:block;
    font-size:21px;
    margin-bottom:3px;
}

.nav-btn.active{
    color:var(--primary);
}

/* DARK MODE */

body.dark .login-card,
body.dark .card,
body.dark .stat-card,
body.dark .dashboard-btn,
body.dark .patient-card,
body.dark .form-control,
body.dark .login-input,
body.dark .theme-btn,
body.dark .bottom-nav,
body.dark .chart,
body.dark .note,
body.dark .filter{
    border:2px solid white;
}

/* MOBILE */

@media(max-width:360px){

    .dashboard-grid{
        grid-template-columns:1fr;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

}


/* =====================================================
   RECORD HISTORY / EDIT / SWITCH MEMBER
===================================================== */
.action-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:10px;
}
.small-btn{
    padding:11px 12px;
    border-radius:11px;
    border:1px solid var(--border);
    background:var(--card);
    color:var(--text);
    font-weight:bold;
}
.small-btn.primary{
    background:var(--primary);
    color:#fff;
    border-color:var(--primary);
}
.history-item{
    border:1px solid var(--border);
    border-radius:14px;
    padding:13px;
    margin-bottom:10px;
    background:var(--bg);
}
.history-item:last-child{margin-bottom:0}
.history-head{
    display:flex;
    justify-content:space-between;
    gap:8px;
    align-items:center;
    margin-bottom:8px;
}
.history-head small{color:var(--muted)}
.member-chip{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    border:1px solid var(--border);
    border-radius:14px;
    padding:13px;
    margin-bottom:9px;
    background:var(--card);
}
.member-chip b{display:block;margin-bottom:4px}
.member-chip small{color:var(--muted)}
.empty-state{
    text-align:center;
    color:var(--muted);
    padding:24px 10px;
}
.section-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-bottom:12px;
}
@media(max-width:360px){
    .action-row{grid-template-columns:1fr}
}

</style>
</head>

<body>

<div class="app">

<!-- =====================================================
LOGIN
===================================================== -->

<section id="loginPage">

<div class="login-card">

<div class="logo">JS</div>

<h1>Welcome</h1>

<p>Jeeva Setu Digital Healthcare</p>

<div class="portal-buttons">

<button class="portal-btn" onclick="showDoctorLogin()">
👨‍⚕️ Doctor Login
</button>

<button class="portal-btn" onclick="showSurveyorLogin()">
🩺 Medical Surveyor Login
</button>

<button class="portal-btn" onclick="showPatientLogin()">
👤 Patient Login
</button>

</div>

<br>

<button
class="theme-btn"
style="display:block;margin:auto"
onclick="toggleTheme()">
🌙
</button>

</div>

</section>


<!-- =====================================================
MAIN APP
===================================================== -->

<section id="mainApp" class="hidden">

<div class="header">

<div>
<h2 id="pageTitle">Dashboard</h2>
<small id="pageSubtitle">Jeeva Setu</small>
</div>

<button class="theme-btn" onclick="toggleTheme()">
🌙
</button>

</div>

<div id="content" class="content"></div>

<div class="bottom-nav">

<button class="nav-btn active" onclick="showDashboard()">
<span>⌂</span>
Home
</button>

<button class="nav-btn" onclick="showPatients()">
<span>👥</span>
Patients
</button>

<button class="nav-btn" onclick="showReports()">
<span>📋</span>
Reports
</button>

<button class="nav-btn" onclick="logout()">
<span>↩</span>
Logout
</button>

</div>

</section>

</div>


<script>
/* =====================================================
   JEEVA SETU - UPDATED DEMO APPLICATION
   Roles:
   1. Doctor   -> dashboard, risk groups, edit records,
                  previous reports and notes
   2. Surveyor -> view/update records and ADD new patients
   3. Patient  -> only records/reports linked to the
                  entered mobile number; no all-patient list
                  and can switch between members sharing a phone
===================================================== */

/* =====================================================
   PATIENT DATABASE
===================================================== */
let patients=[

 notes:[],history:[]
},
{
 id:6,name:"Meena Devi",age:61,sex:"Female",phone:"9000000003",blood:"A+",
 location:"Pollachi",risk:78,
 parameters:{bp:"152/96",glucose:"170 mg/dL",glucoseType:"PG",heartRate:"96 bpm",spo2:"94%",temperature:"37.2 °C",weight:"80 kg",height:"163 cm",bmi:"30.1"},

 notes:[],history:[]

 notes:[],history:[]
},

},

 notes:[],history:[]
}
];

/* Create one initial historical report for every demo patient. */
patients.forEach(p=>{
    p.history=[{
        date:"Initial record",
        source:"Medical Survey",
        parameters:{...p.parameters},
        risk:p.risk
    }];
});

/* =====================================================
   GLOBAL STATE
===================================================== */
let currentPortal="";
let currentPatient=null;
let patientPhoneSession="";
let editingExistingPatient=false;

/* =====================================================
   LOGIN
===================================================== */
function showDoctorLogin(){
document.getElementById("loginPage").innerHTML=`
<div class="login-card">
<div class="logo">JS</div>
<h1>Doctor Login</h1>
<p>Login using Doctor ID and Password</p>
<input id="doctorId" class="login-input" type="text" placeholder="Doctor ID">
<input id="doctorPassword" class="login-input" type="password" placeholder="Password">
<button class="login-btn" onclick="doctorLogin()">Login</button>
<button class="secondary-btn" onclick="location.reload()">Back</button>
</div>`;
}

function doctorLogin(){
let id=document.getElementById("doctorId").value.trim();
let password=document.getElementById("doctorPassword").value;
if(id==="DOC001" && password==="doctor123"){
    currentPortal="doctor";
    openApp();
}else alert("Invalid Doctor ID or Password");
}

function showSurveyorLogin(){
document.getElementById("loginPage").innerHTML=`
<div class="login-card">
<div class="logo">JS</div>
<h1>Surveyor Login</h1>
<p>Login using Surveyor ID and Password</p>
<input id="surveyorId" class="login-input" type="text" placeholder="Surveyor ID">
<input id="surveyorPassword" class="login-input" type="password" placeholder="Password">
<button class="login-btn" onclick="surveyorLogin()">Login</button>
<button class="secondary-btn" onclick="location.reload()">Back</button>
</div>`;
}

function surveyorLogin(){
let id=document.getElementById("surveyorId").value.trim();
let password=document.getElementById("surveyorPassword").value;
if(id==="SUR001" && password==="survey123"){
    currentPortal="surveyor";
    openApp();
}else alert("Invalid Surveyor ID or Password");
}

function showPatientLogin(){
document.getElementById("loginPage").innerHTML=`
<div class="login-card">
<div class="logo">JS</div>
<h1>Patient Login</h1>
<p>Enter your registered mobile number</p>
<input id="loginPhone" class="login-input" type="tel" maxlength="10"
inputmode="numeric" placeholder="Mobile Number">
<button class="login-btn" onclick="patientLogin()">Send OTP</button>
<button class="secondary-btn" onclick="location.reload()">Back</button>
</div>`;
}

function patientLogin(){
let phone=document.getElementById("loginPhone").value.trim();
if(!/^[0-9]{10}$/.test(phone)){
    alert("Enter a valid 10-digit mobile number");
    return;
}
showOTP(phone);
}

function showOTP(phone){
document.getElementById("loginPage").innerHTML=`
<div class="login-card">
<div class="logo">JS</div>
<h1>OTP Verification</h1>
<p>OTP sent to ${phone}</p>
<input id="otp" class="login-input" maxlength="6" inputmode="numeric"
placeholder="Enter 6-digit OTP">
<button class="login-btn" onclick="verifyOTP('${phone}')">Verify OTP</button>
<button class="secondary-btn" onclick="location.reload()">Back</button>
</div>`;
}

function verifyOTP(phone){
let otp=document.getElementById("otp").value.trim();
if(otp!=="123456"){
    alert("Invalid OTP. Demo OTP: 123456");
    return;
}
let matching=patients.filter(p=>p.phone===phone);
if(matching.length===0){
    alert("No patient registered with this number");
    return;
}
patientPhoneSession=phone;
currentPortal="patient";

/* Important: no logout/re-login is required for shared numbers. */
if(matching.length>1){
    showPatientSelection(matching);
}else{
    currentPatient=matching[0];
    openApp();
}
}

function showPatientSelection(list){
document.getElementById("loginPage").innerHTML=`
<div class="login-card">
<div class="logo">JS</div>
<h1>Select Member</h1>
<p>This mobile number is linked to ${list.length} patient records.</p>
<div id="patientSelection"></div>
</div>`;
let box=document.getElementById("patientSelection");
list.forEach(patient=>{
box.innerHTML+=`
<button class="portal-btn" style="width:100%;margin-bottom:10px"
onclick="selectPatient(${patient.id})">
<b>${patient.name}</b><br>
<small>${patient.age} years • ${patient.sex}</small>
</button>`;
});
}

function selectPatient(id){
currentPatient=patients.find(p=>p.id===id);
currentPortal="patient";
openApp();
}

/* =====================================================
   APP ROUTER
===================================================== */
function openApp(){
document.getElementById("loginPage").classList.add("hidden");
document.getElementById("mainApp").classList.remove("hidden");
showDashboard();
}

function showDashboard(){
if(currentPortal==="doctor") doctorDashboard();
else if(currentPortal==="surveyor") surveyorDashboard();
else if(currentPortal==="patient") patientDashboard();
}

/* =====================================================
   DOCTOR DASHBOARD
   Every statistic is clickable and opens the matching records.
===================================================== */
function doctorDashboard(){
setTitle("Doctor Dashboard","Patient monitoring overview");

let total=patients.length;
let high=patients.filter(p=>p.risk>=71).length;
let moderate=patients.filter(p=>p.risk>=31&&p.risk<=70).length;
let low=patients.filter(p=>p.risk<=30).length;

document.getElementById("content").innerHTML=`
<div class="stat-grid">
<button class="stat-card" onclick="showPatients()" style="text-align:left">
<span>Total Patients</span><strong>${total}</strong>
<small>Tap to view all ${total} records</small>
</button>

<button class="stat-card" onclick="showRiskPatients('high')" style="text-align:left">
<span>High Risk</span><strong>${high}</strong>
<small>Tap to view high-risk patients</small>
</button>

<button class="stat-card" onclick="showRiskPatients('moderate')" style="text-align:left">
<span>Moderate Risk</span><strong>${moderate}</strong>
<small>Tap to view moderate-risk patients</small>
</button>

<button class="stat-card" onclick="showRiskPatients('low')" style="text-align:left">
<span>Low Risk</span><strong>${low}</strong>
<small>Tap to view low-risk patients</small>
</button>
</div>

<br>

<div class="dashboard-grid">
<button class="dashboard-btn" onclick="showPatients()">
<div class="icon">👥</div><b>Patients</b>
<small>View all ${total} patient records</small>
</button>

<button class="dashboard-btn" onclick="showRiskPatients('high')">
<div class="icon">🚨</div><b>High Priority</b>
<small>${high} high-risk records</small>
</button>

<button class="dashboard-btn" onclick="showRiskPatients('moderate')">
<div class="icon">⚠️</div><b>Moderate Risk</b>
<small>${moderate} moderate-risk records</small>
</button>

<button class="dashboard-btn" onclick="showRiskPatients('low')">
<div class="icon">✅</div><b>Low Risk</b>
<small>${low} low-risk records</small>
</button>

<button class="dashboard-btn" onclick="showTrends()">
<div class="icon">📈</div><b>Trends</b>
<small>1W • 1M • 3M • 1Y</small>
</button>

<button class="dashboard-btn" onclick="showReports()">
<div class="icon">📋</div><b>Reports</b>

function readAndValidatePatientForm(){
let phone=document.getElementById("patientPhone").value.trim();
let name=document.getElementById("patientName").value.trim();
let age=Number(document.getElementById("patientAge").value);

if(!name){
    alert("Enter patient name");
    return false;
}
if(!/^[0-9]{10}$/.test(phone)){
    alert("Enter a valid 10-digit phone number");
    return false;
}
if(age<=0){
    alert("Enter a valid age");
    return false;
}
return true;
}

function collectParameters(){
return {
bp:document.getElementById("bp").value.trim(),
glucose:document.getElementById("glucose").value.trim()+" mg/dL",
glucoseType:document.getElementById("glucoseType").value,
heartRate:document.getElementById("heartRate").value.trim()+" bpm",
spo2:document.getElementById("spo2").value.trim()+"%",
temperature:document.getElementById("temperature").value.trim()+" °C",
weight:document.getElementById("weight").value.trim()+" kg",
height:document.getElementById("height").value.trim()+" cm",
bmi:document.getElementById("bmi").value.trim()
};
}

function saveCurrentRecord(source){
let oldPhone=currentPatient.phone;

currentPatient.name=document.getElementById("patientName").value.trim();
currentPatient.age=Number(document.getElementById("patientAge").value);
currentPatient.sex=document.getElementById("patientSex").value;
currentPatient.phone=document.getElementById("patientPhone").value.trim();
currentPatient.blood=document.getElementById("patientBlood").value;
currentPatient.location=document.getElementById("patientLocation").value.trim();
currentPatient.parameters=collectParameters();

let riskEl=document.getElementById("riskScore");
if(riskEl){
    let r=Number(riskEl.value);
    if(Number.isFinite(r)) currentPatient.risk=Math.max(0,Math.min(100,r));
}

/* Save the old/latest state into history before the new state becomes
   the current record. This creates previous medical reports. */
currentPatient.history.push({
    date:new Date().toLocaleString(),
    source:source,
    parameters:{...currentPatient.parameters},
    risk:currentPatient.risk
});

/* If a patient changed phone number, the new phone becomes their
   new patient-login grouping automatically. */
if(oldPhone!==currentPatient.phone && currentPortal==="patient"){
    patientPhoneSession=currentPatient.phone;
}
}

function parameterRows(p){

<div class="parameter-row"><span>Height</span><b>${p.height||"-"}</b></div>
<div class="parameter-row"><span>BMI</span><b>${p.bmi||"-"}</b></div>`;
}

function bloodOptions(selected){
let groups=["A+","A-","B+","B-","AB+","AB-","O+","O-"];
return groups.map(g=>`<option value="${g}" ${g===selected?"selected":""}>${g}</option>`).join("");
}

function calculateBMI(){
let weight=parseFloat(document.getElementById("weight").value);
let height=parseFloat(document.getElementById("height").value);
if(weight>0&&height>0){
document.getElementById("bmi").value=(weight/((height/100)*(height/100))).toFixed(1);
}
}

function numericOnly(value){
let m=String(value||"").match(/-?[0-9]+(?:\.[0-9]+)?/);
return m?m[0]:"";
}

function esc(value){
return String(value??"")
.replace(/&/g,"&amp;").replace(/</g,"&lt;")
.replace(/>/g,"&gt;").replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");
}

subtitle="Risk score 31–70";
list=patients.filter(p=>p.risk>=31&&p.risk<=70);
}
else{
title="Low Risk Patients";
subtitle="Risk score 0–30";
list=patients.filter(p=>p.risk<=30);
}

setTitle(title,subtitle);

document.getElementById("content").innerHTML=list.length?list.map(p=>`
<div class="patient-card" onclick="openPatient(${p.id})">
<div class="patient-top">

${p.age} years • ${p.sex}<br>

function selectTrend(button){
document.querySelectorAll(".filter").forEach(b=>b.classList.remove("active"));
button.classList.add("active");
}

/* =====================================================
   RISK HELPERS
===================================================== */
function getRiskClass(score){
if(score<=30)return "green";
if(score<=70)return "yellow";
return "red";
}

function getRiskText(score){
if(score<=30)return "Low Risk";
if(score<=70)return "Moderate Risk";
return "High Risk";
}

/* =====================================================
   TITLE / THEME / LOGOUT
===================================================== */
function setTitle(title,subtitle){
document.getElementById("pageTitle").innerText=title;
document.getElementById("pageSubtitle").innerText=subtitle;
}

function toggleTheme(){
document.body.classList.toggle("dark");
}

function logout(){
currentPortal="";
currentPatient=null;
patientPhoneSession="";
document.getElementById("mainApp").classList.add("hidden");
document.getElementById("loginPage").classList.remove("hidden");
location.reload();
}
